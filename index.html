<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="container">
        <img src="cartera.png" alt="">
        <h1>COTIZADOR</h1>
        <br>
        <br>
        <div id="coin-container">
            <form id="coin-form">
                 <div class="coin-imput-container" >
                <label for="coin ">Elige tu Moneda </label>
                <select class="coin-imput"id="coin">
                    <option selected disabled value="">Selecciona una moneda </option>
                     <option value="USD">Dolar </option>
                     <option value="EUR">Euros</option>
                     <option value="ARS">pesos Argentinos</option>
                     <option value="VES">Bolivares</option>
                </select>
            </div>
            <div class="coin-imput-container" >
                <label for="crypto">Elige tu Cryptomoneda </label>
                <select class="coin-imput"id="crypto">
                    <option selected disabled value="">Selecciona una cryptomoneda </option>
                     <option value="BTC">Bitcoin</option>
                     <option value="ETH">Ethereum</option>
                     <option value="AXS">AXS</option>
                     <option value="BNB">Binance Coin </option>
                </select>
            </div>
            <div class="coin-imput-container" >
                <label for="amount">Elige tu Monto </label>
                <input type="text" class="coin-imput" id="amount" placeholder="Monto">
                
        </div>
        <button id="form-btn" type="submit">COTIZAR </button>

            </form>
            <div id="coin-inf"></div>
            
          <!-- Enlace a tu GitHub y aviso de la API -->
<footer class="footer-credit">
    <p class="api-notice">⚡ Cotizaciones en tiempo real impulsadas por la <strong>API de Binance</strong></p>
    <p>Cotizador hecho por <a href="https://github.com/ProgrammerSol" target="_blank" rel="noopener noreferrer">Sol Peraza</a></p>
</footer>

    </div>
    <script src="index.js" defer></script>
</body>
</html>
